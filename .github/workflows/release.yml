name: Release
# Run manually (Actions → Release → Run workflow) with an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Tag to build, e.g. v0.1.1", required: true }
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          # Apple Silicon runner builds both; Intel is cross-compiled.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional — when absent the build is unsigned and the release notes say so.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }} --bundles app,dmg
          tagName: ${{ inputs.tag }}
          releaseName: DigitsNepal ${{ inputs.tag }}
          releaseBody: "See CHANGELOG.md. Unless stated otherwise, builds are unsigned: right-click → Open on first launch."
          releaseDraft: true
