name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: harness-runner-ecb445490fc054d52b8ea610d97ba947f57033d2-${{ runner.os }}-${{ runner.arch }}
      - run: scripts/build-harness-runner.sh
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features coworker
        env:
          DN_HARNESS_RUNNER: ${{ github.workspace }}/src-tauri/binaries/openworker-harness-aarch64-apple-darwin
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: worker
      - run: npx tsc --noEmit && npx vitest run
        working-directory: worker
      - run: npm install --no-audit --no-fund
        working-directory: pwa
      - run: npm test && npm run build
        working-directory: pwa
