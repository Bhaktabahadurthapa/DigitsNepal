name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do **not** paste private or confidential text. Use a made-up example that reproduces the problem."
  - type: input
    id: version
    attributes: { label: DigitsNepal version, placeholder: "0.1.0" }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version and chip, placeholder: "macOS 26.1, Apple M2" }
    validations: { required: true }
  - type: dropdown
    id: provider
    attributes: { label: Provider, options: [Ollama, Gemini, Not applicable] }
  - type: input
    id: app
    attributes: { label: "App you were translating in (for shortcut/replace issues)", placeholder: "e.g. Slack, Notes, Chrome" }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
    validations: { required: true }
