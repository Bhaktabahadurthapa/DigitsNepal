name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposed solution }
  - type: textarea
    id: privacy
    attributes: { label: Privacy impact, description: "Does it read new data, need new permissions, or use the network?" }
